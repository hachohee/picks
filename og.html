<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OG</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    color:#33302B;letter-spacing:-.02em;
    background:
      radial-gradient(70% 90% at 8% 6%, #FBE3CE 0%, rgba(251,227,206,0) 60%),
      radial-gradient(60% 80% at 96% 96%, #E3ECD9 0%, rgba(227,236,217,0) 62%),
      #FAF5EC;
    position:relative;
  }
  .wrap{position:absolute;inset:0;padding:72px 84px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:20px;letter-spacing:.18em;color:#AC9179;margin-bottom:18px}
  h1{font-family:'Gowun Batang',serif;font-size:76px;line-height:1.18;font-weight:700;letter-spacing:-.06em}
  .handle{font-size:24px;color:#A2917F;margin-top:14px}
  .tag{font-size:34px;font-weight:700;margin-top:34px;color:#4B4238}
  .sub{font-size:23px;color:#75695C;margin-top:12px}
  .row{display:flex;gap:14px;margin-top:44px}
  .pill{background:#FFFDF8;border:1px solid #EADFCF;border-radius:999px;padding:14px 24px;font-size:22px;color:#5C5145}
  .tiles{position:absolute;right:84px;top:150px;width:300px;display:flex;flex-wrap:wrap;gap:18px;justify-content:flex-end}
  .tile{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;font-size:40px;box-shadow:0 6px 16px rgba(150,120,90,.10)}
  .c1{background:linear-gradient(150deg,#FBEEDB,#F5DFC2)}
  .c2{background:linear-gradient(150deg,#EBF1E3,#DAE5D0)}
  .c3{background:linear-gradient(150deg,#FCE8DC,#F7D3C2)}
  .c4{background:linear-gradient(150deg,#E4F1EB,#D1E6DB)}
  .c5{background:linear-gradient(150deg,#E8EFF6,#D6E2EE)}
  .c6{background:linear-gradient(150deg,#FBE8E7,#F5D4D3)}
  .foot{position:absolute;left:84px;bottom:58px;font-size:19px;color:#A99885;letter-spacing:0}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">살림 노트 · 찐템 큐레이션</p>
    <h1>집순이보물창고</h1>
    <p class="handle">@jibsooni.box</p>
    <p class="tag">직접 써 보고 살아남은 찐템 모음집 🛒</p>
    <p class="sub">광고 문구 말고, 내 돈 주고 사서 쓴 것만. 살림 · 밥상 · 힐링 21가지.</p>
    <div class="row">
      <span class="pill">살림·정리 4</span>
      <span class="pill">밥상·간식 10</span>
      <span class="pill">힐링·뷰티·꿀템 7</span>
    </div>
  </div>
  <div class="tiles">
    <div class="tile c1">🧺</div>
    <div class="tile c2">🗄️</div>
    <div class="tile c3">👖</div>
    <div class="tile c4">🧽</div>
    <div class="tile c5">🐟</div>
    <div class="tile c6">🍓</div>
  </div>
  <p class="foot">jibsooni-box.pages.dev</p>
</body>
</html>
