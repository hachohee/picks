<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>집순이보물창고 · 직접 써 보고 살아남은 찐템 모음집 🛒</title>
<meta name="description" content="집순이보물창고(@jibsooni.box) · 직접 사서 써 보고 살아남은 살림·밥상·힐링 찐템 17가지. 한 줄 찐후기와 쿠팡 링크를 한 페이지에.">
<meta name="theme-color" content="#FAF5EC">
<meta property="og:type" content="website">
<meta property="og:title" content="집순이보물창고 · 직접 써 보고 살아남은 찐템 모음집 🛒">
<meta property="og:description" content="집순이보물창고 · 광고 문구 말고, 내 돈 주고 사서 쓴 것만. 살림·밥상·힐링 17가지 찐후기.">
<meta property="og:url" content="https://hachohee.github.io/picks/">
<meta property="og:image" content="https://hachohee.github.io/picks/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hachohee.github.io/picks/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF5EC;
    --paper:#FFFCF6;
    --ink:#33302B;
    --ink-soft:#6C6257;
    --ink-mute:#9A8B7B;
    --line:#EFE4D4;
    --coral:#D56A4C;
    --coral-deep:#C1553A;
    --sage:#8CA37F;
    --shadow:0 2px 12px rgba(140,110,80,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:#F1E7D9;
    color:var(--ink);
    font-family:'Gowun Dodum','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    font-size:15px;
    line-height:1.5;
    letter-spacing:-.01em;
    word-break:keep-all;
    overflow-wrap:anywhere;
  }
  .page{
    position:relative;
    max-width:470px;
    margin:0 auto;
    min-height:100vh;
    background:var(--ivory);
    box-shadow:0 0 60px rgba(130,100,70,.10);
    overflow:hidden;
  }

  /* ---------- header ---------- */
  .hero{
    position:relative;
    padding:26px 22px 16px;
    text-align:center;
    background:
      radial-gradient(120% 80% at 12% 0%, rgba(250,224,206,.85) 0%, rgba(250,224,206,0) 55%),
      radial-gradient(110% 70% at 96% 6%, rgba(222,234,214,.75) 0%, rgba(222,234,214,0) 58%),
      var(--ivory);
  }
  .avatar{
    width:70px;height:70px;margin:0 auto 11px;
    display:grid;place-items:center;
    font-size:31px;line-height:1;
    border-radius:50%;
    background:linear-gradient(150deg,#FFE9D4,#F9CFB7 70%,#F3C2A8);
    border:3px solid #FFFDF8;
    box-shadow:0 6px 18px rgba(197,120,86,.22);
  }
  .badge{
    display:inline-block;
    margin:0 0 8px;
    font-size:10px;
    letter-spacing:.14em;
    color:#A8907A;
    font-weight:400;
  }
  h1.brand{
    margin:0;
    font-family:'Gowun Batang','Noto Serif CJK KR',serif;
    font-size:26px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:-.05em;
    color:#2E2A25;
  }
  .handle{
    margin:4px 0 0;
    font-size:11.5px;
    color:var(--ink-mute);
    letter-spacing:.02em;
  }
  .tagline{
    margin:11px auto 0;
    font-family:inherit;
    max-width:320px;
    font-size:14px;
    line-height:1.55;
    font-weight:700;
    text-wrap:balance;
    letter-spacing:-.025em;
    color:#4B4238;
  }
  .intro{
    margin:7px auto 0;
    max-width:300px;
    font-size:12.6px;
    line-height:1.7;
    color:var(--ink-soft);
    text-wrap:balance;
  }
  .chips{
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
    margin:15px 0 0;
  }
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    padding:9px 14px;
    border-radius:999px;
    background:#FFFDF8;
    border:1px solid #EADFCF;
    box-shadow:0 1px 3px rgba(150,120,90,.07);
    color:#4C443B;
    font-size:12px;
    text-decoration:none;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .chip:active{transform:scale(.97)}
  .chip .em{font-size:10px;line-height:1}

  .stats{
    display:flex;justify-content:center;align-items:center;gap:0;
    margin:14px auto 0;
    padding-top:12px;
    max-width:330px;
    border-top:1px dashed #E7DAC6;
  }
  .stats div{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
    border-right:1px solid #EDE2D2;
  }
  .stats div:last-child{border-right:0}
  .stats b{
    font-size:16px;font-weight:700;color:var(--coral-deep);letter-spacing:0;
    font-family:'Gowun Batang',serif;
  }
  .stats span{font-size:10.5px;color:var(--ink-mute);letter-spacing:0}

  /* ---------- filters ---------- */
  .filters{
    position:sticky;top:0;z-index:20;
    display:flex;gap:7px;
    padding:12px 18px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg,rgba(250,245,236,.98) 62%,rgba(250,245,236,.90) 100%);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 92%,rgba(0,0,0,.25) 100%);
    mask-image:linear-gradient(90deg,#000 0,#000 92%,rgba(0,0,0,.25) 100%);
    border-bottom:1px solid rgba(235,224,208,.6);
  }
  .filters::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    display:inline-flex;align-items:center;gap:4px;
    padding:8px 12px;
    border-radius:999px;
    border:1px solid #E8DCCB;
    background:#FFFDF8;
    color:#6D6154;
    font-family:inherit;
    font-size:12.5px;
    letter-spacing:-.01em;
    cursor:pointer;
    transition:background .16s ease,color .16s ease,box-shadow .16s ease,transform .12s ease;
  }
  .tab:active{transform:scale(.97)}
  .tab .cnt{font-size:10.5px;color:#AE9F8D;letter-spacing:0}
  .tab[aria-selected="true"]{
    background:linear-gradient(135deg,#D96C4D,#C7573B);
    border-color:transparent;
    color:#FFF8F2;
    font-weight:700;
    box-shadow:0 4px 12px rgba(197,87,59,.26);
  }
  .tab[aria-selected="true"] .cnt{color:rgba(255,248,242,.8)}

  /* ---------- cards ---------- */
  .list{
    display:flex;flex-direction:column;gap:13px;
    padding:16px 16px 8px;
    min-height:40vh;
  }
  .card{
    display:grid;
    grid-template-columns:64px minmax(0,1fr);
    column-gap:12px;row-gap:10px;
    padding:14px;
    border-radius:20px;
    background:var(--paper);
    border:1px solid #F0E5D5;
    box-shadow:var(--shadow);
    animation:rise .34s cubic-bezier(.22,.7,.35,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .card{animation:none}
    *{transition:none!important}
  }
  .tile{
    width:64px;height:64px;
    border-radius:17px;
    display:grid;place-items:center;
    font-size:28px;line-height:1;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
  }
  .tone-cream{background:linear-gradient(150deg,#FBEEDB,#F5DFC2)}
  .tone-sage{background:linear-gradient(150deg,#EBF1E3,#DAE5D0)}
  .tone-peach{background:linear-gradient(150deg,#FCE8DC,#F7D3C2)}
  .tone-mint{background:linear-gradient(150deg,#E4F1EB,#D1E6DB)}
  .tone-sky{background:linear-gradient(150deg,#E8EFF6,#D6E2EE)}
  .tone-blush{background:linear-gradient(150deg,#FBE8E7,#F5D4D3)}

  .name{
    margin:1px 0 0;
    font-size:14.5px;
    line-height:1.42;
    font-weight:700;
    letter-spacing:-.025em;
    color:#2F2B26;
  }
  .option{
    margin:3px 0 0;
    font-size:11px;
    color:#A2937F;
    letter-spacing:0;
  }
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .tag{
    padding:3px 7px;
    border-radius:6px;
    background:#F7F0E4;
    color:#8B7A65;
    font-size:10.5px;
    letter-spacing:-.01em;
    line-height:1.35;
  }
  .tag:first-child{background:#FBEBE3;color:#BC6046}

  .quote{
    grid-column:1/-1;
    margin:0;
    padding-left:10px;
    border-left:2px solid #ECD4BD;
    font-size:12.8px;
    line-height:1.66;
    color:#5D5348;
    letter-spacing:-.012em;
  }

  .actions{
    grid-column:1/-1;
    display:flex;align-items:center;gap:10px;
    margin-top:0;
  }
  .price{
    font-size:13.5px;
    font-weight:700;
    letter-spacing:-.02em;
    color:#2F2B26;
  }
  .price:empty{display:none}
  .buy{
    margin-left:auto;
    display:inline-flex;align-items:center;gap:5px;
    padding:9px 13px;
    border-radius:11px;
    background:linear-gradient(135deg,#D96C4D,#C5553A);
    color:#FFF8F2;
    font-size:12.5px;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 4px 10px rgba(197,85,58,.22);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .buy:active{transform:scale(.97);box-shadow:0 2px 6px rgba(197,85,58,.2)}
  .soon{
    margin-left:auto;
    display:inline-flex;align-items:center;gap:5px;
    padding:8px 11px;
    border-radius:11px;
    border:1px dashed #DFD0BB;
    background:#F5EDE1;
    color:#A08F7B;
    font-size:11.5px;
    letter-spacing:-.01em;
    white-space:nowrap;
  }
  .soon .hint{font-size:10px;color:#B3A491}

  .meta{
    grid-column:1/-1;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:-2px;
    font-size:10.8px;
    color:#AC9E8E;
    letter-spacing:0;
  }
  .meta .detail{
    margin-left:auto;
    color:#BE6A4F;
    text-decoration:none;
    border-bottom:1px solid rgba(190,106,79,.35);
    padding-bottom:1px;
    white-space:nowrap;
  }
  .meta .note{line-height:1.45}

  /* ---------- footer ---------- */
  .foot{padding:18px 20px 34px;text-align:center}
  .disclosure{
    margin:0;
    padding:13px 14px;
    border-radius:14px;
    background:#F5EDE0;
    border:1px solid #EDE1CF;
    color:#8D7F6E;
    font-size:10.6px;
    line-height:1.65;
    text-align:left;
    letter-spacing:0;
  }
  .sign{
    margin:16px 0 0;
    font-size:12px;
    line-height:1.75;
    color:#9C8E7D;
  }
  .updated{
    margin:10px 0 0;
    font-size:10px;
    color:#B5A896;
    letter-spacing:.02em;
  }
  .top{
    display:inline-block;
    margin:14px 0 0;
    font-size:11px;
    color:#A79885;
    text-decoration:none;
    border-bottom:1px dashed #D8C9B5;
    padding-bottom:2px;
  }

  @media (min-width:471px){
    .page{border-left:1px solid #EFE4D4;border-right:1px solid #EFE4D4}
  }
</style>
</head>
<body>
<div class="page" id="top">
  <header class="hero">
    <div class="avatar" aria-hidden="true">📦</div>
    <p class="badge" id="badge"></p>
    <h1 class="brand" id="brand"></h1>
    <p class="handle" id="handle" hidden></p>
    <h2 class="tagline" id="title"></h2>
    <p class="intro" id="intro"></p>
    <nav class="chips" id="chips" aria-label="블로그 바로가기"></nav>
    <div class="stats" id="stats"></div>
  </header>

  <div class="filters" id="filters" role="tablist" aria-label="카테고리"></div>

  <main class="list" id="list" aria-live="polite"></main>

  <footer class="foot">
    <p class="disclosure" id="disclosure"></p>
    <p class="sign">직접 사서 써 보고 남은 것만.<br>새 찐템은 이 페이지에 계속 추가돼요 🧡</p>
    <p class="updated" id="updated"></p>
    <a class="top" href="#top">맨 위로 ↑</a>
  </footer>
</div>

<script src="items.js"></script>
<script>
(function () {
  var D = window.PICKS_DATA;
  var $ = function (id) { return document.getElementById(id); };

  if (!D || !D.site || !Array.isArray(D.items)) {
    $("list").innerHTML = '<p style="padding:28px 10px;text-align:center;color:#8d7f6e">찐템 목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>';
    return;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- header ---------- */
  var brand = D.site.brand || "";
  document.title = (brand ? brand + " · " : "") + D.site.title.replace(/\n/g, " ");
  $("brand").textContent = brand;
  if (D.site.account) { $("handle").textContent = D.site.account; $("handle").hidden = false; }
  $("badge").textContent = D.site.badge || "";
  $("title").textContent = D.site.title || "";
  $("intro").textContent = D.site.intro || "";

  $("chips").innerHTML = (D.site.links || []).map(function (l) {
    return '<a class="chip" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
      '<span class="em" aria-hidden="true">' + esc(l.emoji || "·") + "</span>" + esc(l.label) + "</a>";
  }).join("");

  var live = D.items.filter(function (it) { return !!it.link; }).length;
  $("stats").innerHTML =
    "<div><b>" + D.items.length + "</b><span>찐템</span></div>" +
    "<div><b>" + live + "</b><span>바로 구매</span></div>" +
    "<div><b>" + (D.items.length - live) + "</b><span>링크 준비</span></div>";

  /* ---------- filters ---------- */
  var active = "all";
  function countOf(id) {
    return id === "all" ? D.items.length : D.items.filter(function (it) { return it.category === id; }).length;
  }
  $("filters").innerHTML = D.categories.map(function (c) {
    return '<button class="tab" type="button" role="tab" data-cat="' + esc(c.id) + '"' +
      ' aria-selected="' + (c.id === "all") + '">' + esc(c.label) +
      '<span class="cnt">' + countOf(c.id) + "</span></button>";
  }).join("");

  $("filters").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab");
    if (!btn) return;
    var next = btn.getAttribute("data-cat");
    if (next === active) return;
    active = next;
    Array.prototype.forEach.call($("filters").querySelectorAll(".tab"), function (b) {
      b.setAttribute("aria-selected", String(b === btn));
    });
    render();
  });

  /* ---------- cards ---------- */
  function cardHTML(it, i) {
    var soon = it.opens ? "곧 공개 · " + it.opens : "곧 링크 연결 중";
    return '<article class="card" style="animation-delay:' + (i * 28) + 'ms">' +
      '<div class="tile tone-' + esc(it.tone || "cream") + '" aria-hidden="true">' + esc(it.emoji || "🛒") + "</div>" +
      '<div class="head">' +
        '<h2 class="name">' + esc(it.name) + "</h2>" +
        (it.option ? '<p class="option">' + esc(it.option) + "</p>" : "") +
        '<div class="tags">' + (it.tags || []).map(function (t) {
          return '<span class="tag">' + esc(t) + "</span>";
        }).join("") + "</div>" +
      "</div>" +
      '<p class="quote">' + esc(it.quote) + "</p>" +
      '<div class="actions">' +
        '<span class="price">' + esc(it.price || "") + "</span>" +
        (it.link
          ? '<a class="buy" href="' + esc(it.link) + '" target="_blank" rel="noopener sponsored">쿠팡에서 보기 <span aria-hidden="true">↗</span></a>'
          : '<span class="soon">' + esc(soon) + "</span>") +
      "</div>" +
      ((it.note || it.blog)
        ? '<div class="meta">' +
            '<span class="note">' + esc(it.note || "") + "</span>" +
            (it.blog ? '<a class="detail" href="' + esc(it.blog) + '" target="_blank" rel="noopener">상세 후기 →</a>' : "") +
          "</div>"
        : "") +
      "</article>";
  }

  function render() {
    var rows = D.items.filter(function (it) { return active === "all" || it.category === active; });
    $("list").innerHTML = rows.map(cardHTML).join("");
  }
  render();

  /* ---------- footer ---------- */
  $("disclosure").textContent = D.site.disclosure || "";
  $("updated").textContent = D.site.updated ? D.site.updated.replace(/-/g, ".") + " 기준" : "";
})();
</script>
</body>
</html>
