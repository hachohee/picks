<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>집순이보물창고 · 찐템 21 모음집</title>
<meta name="description" content="집순이보물창고(@jibsooni.box) · 직접 사서 써 보고 남은 살림·밥상·힐링 찐템 21가지. 사진과 번호로 바로 찾아 쿠팡에서 보세요.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="집순이보물창고 · 찐템 21 모음집">
<meta property="og:description" content="내 돈 주고 사서 쓴 것만. 살림·밥상·힐링 찐템 21가지 한 줄 후기와 쿠팡 링크.">
<meta property="og:url" content="https://jibsooni-box.pages.dev/">
<meta property="og:image" content="https://jibsooni-box.pages.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jibsooni-box.pages.dev/og.png">
<link rel="icon" href="assets/profile.png">
<style>
  :root{
    --ink:#1e1e1e;
    --sub:#767676;
    --sub2:#9a9a9a;
    --line:#eeeeee;
    --bg:#ffffff;
    --bg-soft:#f7f7f7;
    --brand:#e8553f;
    --brand-soft:#fff2ef;
    --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    letter-spacing:-.01em;
    word-break:keep-all;
    overflow-wrap:anywhere;
  }
  .page{max-width:860px;margin:0 auto}

  /* ---------- header ---------- */
  .top{padding:24px 20px 12px;text-align:center}
  .avatar{
    width:78px;height:78px;margin:0 auto 10px;display:block;
    border-radius:50%;
    object-fit:cover;
    background:var(--bg-soft);
    border:1px solid var(--line);
    box-shadow:0 3px 12px rgba(0,0,0,.06);
  }
  h1.brand{
    margin:0;font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.045em;color:#111;
  }
  .handle{margin:3px 0 0;font-size:12.5px;color:var(--sub2);letter-spacing:0}
  .intro{margin:7px 0 0;font-size:12.5px;line-height:1.6;color:var(--sub)}
  .guide{
    margin:11px auto 0;max-width:340px;
    font-size:13.5px;line-height:1.5;font-weight:700;color:#3a3a3a;letter-spacing:-.02em;
  }
  .insta{
    display:inline-flex;align-items:center;gap:5px;
    margin:9px 0 0;padding:6px 11px;
    border:1px solid var(--line);border-radius:999px;background:#fff;
    color:#4a4a4a;font-size:12px;text-decoration:none;
  }
  .insta:active{background:var(--bg-soft)}

  .disclosure-top{
    margin:0 20px;padding:0;
    font-size:10.5px;line-height:1.5;color:#a0a0a0;letter-spacing:0;text-align:center;
  }

  /* ---------- sticky search + tabs ---------- */
  .sticky{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.97);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:10px 14px 0;
  }
  .search{position:relative}
  .search svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:#9a9a9a;fill:none;stroke-width:2;pointer-events:none;
  }
  .search input{
    width:100%;height:44px;
    padding:0 38px 0 35px;
    border:1px solid #e4e4e4;border-radius:10px;
    background:var(--bg-soft);
    color:var(--ink);
    font-family:inherit;font-size:16px;letter-spacing:-.01em;
    outline:none;-webkit-appearance:none;appearance:none;
  }
  .search input::placeholder{color:#a8a8a8;font-size:13.5px}
  .search input:focus{border-color:#d6d6d6;background:#fff;box-shadow:0 0 0 3px rgba(232,85,63,.08)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  .clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;display:none;place-items:center;
    border:0;border-radius:50%;background:#e6e6e6;color:#767676;
    font-size:14px;line-height:1;cursor:pointer;
  }
  .clear.on{display:grid}

  .tabs{
    display:flex;gap:7px;
    margin:0 -14px;padding:10px 14px 11px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    padding:8px 13px;
    border:1px solid #e6e6e6;border-radius:999px;background:#fff;
    color:#555;font-family:inherit;font-size:13px;letter-spacing:-.02em;
    cursor:pointer;white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tab .cnt{font-size:11px;color:#a0a0a0;letter-spacing:0}
  .tab[aria-selected="true"]{
    background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;
  }
  .tab[aria-selected="true"] .cnt{color:rgba(255,255,255,.82)}

  /* ---------- result line ---------- */
  .result{
    margin:0;padding:12px 16px 2px;
    font-size:12px;color:var(--sub);letter-spacing:0;
  }
  .result b{color:var(--ink);font-weight:700}

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px 10px;
    padding:10px 14px 26px;
    min-height:40vh;
  }
  .card{
    display:flex;flex-direction:column;
    text-decoration:none;color:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .thumb{
    position:relative;
    aspect-ratio:1/1;
    border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;overflow:hidden;
  }
  .thumb img{
    width:100%;height:100%;display:block;object-fit:cover;
    transition:transform .25s ease;
  }
  .card:active .thumb img{transform:scale(.985)}
  .thumb.err{background:linear-gradient(150deg,#faf3ec,#f2e7db)}
  .num{
    position:absolute;top:7px;left:7px;
    padding:2px 6px;border-radius:6px;
    background:rgba(255,255,255,.94);
    border:1px solid #f1dcd7;
    color:var(--brand);font-size:11px;font-weight:800;letter-spacing:0;line-height:1.4;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
  }
  .body{display:flex;flex-direction:column;flex:1;padding:9px 2px 0}
  .name{
    margin:0;
    font-size:13px;line-height:1.38;font-weight:700;letter-spacing:-.03em;color:#1b1b1b;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .name .n{color:var(--brand);font-weight:800;margin-right:2px}
  .quote{
    margin:4px 0 0;
    min-height:2.9em;
    font-size:11.5px;line-height:1.45;color:#828282;letter-spacing:-.015em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .price{
    margin:8px 0 8px;
    font-size:13.5px;font-weight:800;letter-spacing:-.03em;color:#111;
  }
  .price.unknown{font-size:11.5px;font-weight:500;color:#a0a0a0}
  .buy{
    display:flex;align-items:center;justify-content:center;gap:4px;
    margin-top:auto;padding-top:0;height:33px;
    border-radius:8px;background:var(--brand);
    color:#fff;font-size:12.5px;font-weight:700;letter-spacing:-.01em;
  }
  .card:active .buy{background:#d34a35}
  .empty{
    grid-column:1/-1;
    padding:52px 10px 60px;text-align:center;color:#9a9a9a;font-size:13px;line-height:1.7;
  }
  .empty .big{display:block;font-size:26px;margin-bottom:10px}

  /* ---------- footer ---------- */
  .foot{padding:8px 16px 40px;text-align:center;border-top:1px solid var(--line);margin-top:6px}
  .disclosure{
    margin:18px 0 0;padding:12px 13px;border-radius:10px;background:var(--bg-soft);
    color:#8d8d8d;font-size:10.5px;line-height:1.6;letter-spacing:0;text-align:left;
  }
  .sign{margin:16px 0 0;font-size:12px;line-height:1.7;color:#8f8f8f}
  .updated{margin:8px 0 0;font-size:10.5px;color:#b4b4b4;letter-spacing:0}
  .toplink{display:inline-block;margin:14px 0 0;font-size:11.5px;color:#8f8f8f;text-decoration:none;border-bottom:1px dashed #d9d9d9;padding-bottom:2px}

  @media (min-width:560px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}
    .name{font-size:13.5px}
  }
  @media (min-width:820px){
    .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="page" id="top">

  <header class="top">
    <img class="avatar" id="avatar" src="assets/profile.png" alt="집순이보물창고 프로필" width="86" height="86">
    <h1 class="brand" id="brand">집순이보물창고</h1>
    <p class="handle" id="handle">@jibsooni.box</p>
    <p class="intro" id="intro"></p>
    <p class="guide" id="guide"></p>
    <a class="insta" id="insta" href="https://www.instagram.com/jibsooni.box/" target="_blank" rel="noopener">📷 인스타그램 ↗</a>
  </header>

  <p class="disclosure-top" id="disclosureTop"></p>

  <div class="sticky">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
             placeholder="상품 이름이나 번호로 검색해 보세요 (예: 01, 행주)" aria-label="상품 검색">
      <button class="clear" id="clear" type="button" aria-label="검색어 지우기">✕</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="카테고리"></div>
  </div>

  <p class="result" id="result" aria-live="polite"></p>
  <main class="grid" id="grid"></main>

  <footer class="foot">
    <p class="disclosure" id="disclosure"></p>
    <p class="sign">직접 사서 써 보고 남은 것만.<br>새 찐템은 이 페이지에 계속 추가돼요 🧡</p>
    <p class="updated" id="updated"></p>
    <a class="toplink" href="#top">맨 위로 ↑</a>
  </footer>
</div>

<script src="items.js"></script>
<script>
(function () {
  var D = window.PICKS_DATA;
  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid");

  if (!D || !Array.isArray(D.items)) {
    grid.innerHTML = '<p class="empty"><span class="big">🛒</span>목록을 불러오지 못했어요.<br>잠시 후 새로고침해 주세요.</p>';
    return;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function flat(s) { return String(s == null ? "" : s).toLowerCase().replace(/\s+/g, ""); }

  /* ---------- header ---------- */
  var site = D.site || {};
  var brand = site.brand || "집순이보물창고";
  document.title = brand + " · 찐템 " + D.items.length + " 모음집";
  $("brand").textContent = brand;
  if (site.avatar) $("avatar").src = site.avatar;
  if (site.account) $("handle").textContent = site.account;
  $("intro").textContent = site.intro || "";
  $("guide").textContent = site.guide || "";
  $("q").placeholder = site.searchPlaceholder || "상품 이름이나 번호로 검색해 보세요";

  var links = site.links || [];
  if (links.length) {
    var l = links[0];
    $("insta").href = l.url;
    $("insta").textContent = (l.emoji ? l.emoji + " " : "") + l.label + " ↗";
  } else {
    $("insta").style.display = "none";
  }

  var disclosure = site.disclosure || "";
  $("disclosureTop").textContent = disclosure;
  $("disclosure").textContent = disclosure;
  $("updated").textContent = site.updated ? site.updated.replace(/-/g, ".") + " 기준" : "";

  /* ---------- categories ---------- */
  var cats = D.categories || [{ id: "all", label: "전체" }];
  var active = "all";
  function countOf(id) {
    return id === "all" ? D.items.length : D.items.filter(function (it) { return it.category === id; }).length;
  }
  $("tabs").innerHTML = cats.map(function (c) {
    return '<button class="tab" type="button" role="tab" data-cat="' + esc(c.id) + '"' +
      ' aria-selected="' + (c.id === active) + '">' + esc(c.label) +
      '<span class="cnt">' + countOf(c.id) + "</span></button>";
  }).join("");

  $("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab");
    if (!btn) return;
    var next = btn.getAttribute("data-cat");
    if (next === active) return;
    active = next;
    Array.prototype.forEach.call($("tabs").querySelectorAll(".tab"), function (b) {
      b.setAttribute("aria-selected", String(b === btn));
    });
    render();
  });

  /* ---------- search ---------- */
  var q = "";
  var input = $("q");
  var clearBtn = $("clear");

  input.addEventListener("input", function () {
    q = input.value.trim();
    clearBtn.classList.toggle("on", q.length > 0);
    render();
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { input.value = ""; q = ""; clearBtn.classList.remove("on"); render(); }
  });
  clearBtn.addEventListener("click", function () {
    input.value = ""; q = ""; clearBtn.classList.remove("on"); render(); input.focus();
  });

  function textOf(it) {
    return flat([
      it.name, it.option, it.quote,
      (it.keywords || []).join(" "), (it.tags || []).join(" ")
    ].join(" "));
  }
  function matches(it, fq) {
    if (!fq) return true;
    // 숫자만 입력하면 상품 번호로만 찾는다 ("01" → 01번, "1" → 01번, "10" → 10번)
    if (/^[0-9]+$/.test(fq)) {
      var n = fq.replace(/^0+(?=.)/, "");
      return n === String(it.num);
    }
    return textOf(it).indexOf(fq) !== -1;
  }

  /* ---------- cards ---------- */
  function cardHTML(it) {
    var n = pad2(it.num);
    var price = it.price
      ? '<p class="price">' + esc(it.price) + "</p>"
      : '<p class="price unknown">가격은 쿠팡에서 확인</p>';
    return '<a class="card" href="' + esc(it.link) + '" target="_blank" rel="noopener sponsored"' +
        ' aria-label="' + esc(n + " " + it.name + " · 쿠팡에서 보기") + '">' +
      '<div class="thumb">' +
        '<img src="' + esc(it.image) + '" alt="' + esc(it.name) + '" width="500" height="500" decoding="async">' +
        '<span class="num">' + n + "</span>" +
      "</div>" +
      '<div class="body">' +
        '<h2 class="name"><span class="n">' + n + ".</span> " + esc(it.name) + "</h2>" +
        '<p class="quote">' + esc(it.quote || "") + "</p>" +
        price +
        '<span class="buy">쿠팡 보기 <span aria-hidden="true">↗</span></span>' +
      "</div>" +
    "</a>";
  }

  function render() {
    var catLabel = "전체";
    for (var i = 0; i < cats.length; i++) {
      if (cats[i].id === active) catLabel = cats[i].label;
    }
    var fq = flat(q);
    var rows = D.items.filter(function (it) {
      if (active !== "all" && it.category !== active) return false;
      return matches(it, fq);
    });

    if (!rows.length) {
      grid.innerHTML = '<p class="empty"><span class="big">🔍</span>' +
        (q ? "‘" + esc(q) + "’ 검색 결과가 없어요.<br>다른 번호나 이름으로 찾아보세요." : "아직 상품이 없어요.") +
        "</p>";
    } else {
      grid.innerHTML = rows.map(cardHTML).join("");
      Array.prototype.forEach.call(grid.querySelectorAll(".thumb img"), function (img) {
        img.addEventListener("error", function () { img.parentNode.classList.add("err"); });
      });
    }

    $("result").innerHTML = q
      ? "‘" + esc(q) + "’ 검색 결과 <b>" + rows.length + "</b>개"
      : catLabel + " <b>" + rows.length + "</b>개";
  }

  render();
})();
</script>
</body>
</html>
